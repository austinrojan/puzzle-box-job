<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DM Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400;1,600&family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<style>
/* ============================================
   SECTION: CSS Reset & Custom Properties
   ============================================ */

@layer tokens {
  :root {
    /* ── DM Guide: Layout Dimensions ── */
    --nav-width: 17.5rem;
    --combat-width: 22.5rem;
    --tab-height: 2.375rem;
    --heat-height: 2rem;
    --nav-child-indent: 2.75rem;
    --tab-min-width: 7.5rem;
    --tab-max-width: 12.5rem;
    --scrollbar-size: 0.5rem;

    /* ── DM Guide: Extended Spacing ── */
    --space-12: 3rem;
    --space-16: 4rem;

    /* ── DM Guide: Font Sizes ── */
    --font-size-heading-hero: 2.625rem;

    /* ── DM Guide: UI Scale ── */
    --ui-scale: 1;

    /* ── DM Guide: Z-Index Layers ── */
    --z-combat-header: 10;
    --z-nav-resize: 50;
    --z-heat-bar: 90;
    --z-tab-bar: 100;
    --z-scale-popover: 200;
    --z-drawer-backdrop: 400;
    --z-drawer: 500;
    --z-tooltip: 900;
    --z-search: 1000;
    --z-presentation: 1010;
    --z-vignette: 9998;
    --z-noise: 9999;
  }
}

@layer base {
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: calc(clamp(0.875rem, 0.7321rem + 0.2232vw, 1rem) * var(--ui-scale)); }
body {
  font-family: var(--font-body);
  background: var(--bg-0);
  color: var(--text-primary);
  line-height: 1.65;
  letter-spacing: 0.01em;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
}

/* Scrollbar styling */
::-webkit-scrollbar { width: var(--scrollbar-size); height: var(--scrollbar-size); }
::-webkit-scrollbar-track { background: var(--bg-1); }
::-webkit-scrollbar-thumb { background: var(--bg-4); border-radius: var(--radius-md); }
::-webkit-scrollbar-thumb:hover { background: var(--gold-dim); }
}

/* ============================================
   SECTION: App Layout (CSS Grid)
   ============================================ */
@layer layout {
#app {
  --sidebar-w: var(--nav-width);
  --combat-w: 0px;
  display: grid;
  grid-template-rows: var(--tab-height) var(--heat-height) 1fr;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr) var(--combat-w);
  height: 100vh;
  width: 100vw;
  overflow: hidden;
  position: relative;
  transition: grid-template-columns 280ms ease-in-out;
}
#app[data-sidebar="collapsed"] { --sidebar-w: 3.5rem; }
#app[data-sidebar="hidden"]    { --sidebar-w: 0px; }
#app.combat-open { --combat-w: var(--combat-width); }
/* Fallback: blocking script sets data-sidebar on <html> before JS moves it to #app */
html[data-sidebar="collapsed"] #app:not([data-sidebar]) { --sidebar-w: 3.5rem; }
html[data-sidebar="hidden"] #app:not([data-sidebar]) { --sidebar-w: 0px; }

#combat-backdrop { display: none; }

/* ── Drawer overlay mode (narrow viewports) ── */
@media (max-width: 1199px) {
  #app.combat-open { --combat-w: 0px; }

  #combat-panel {
    position: fixed;
    right: 0;
    top: 0;
    width: min(var(--combat-width), 85vw);
    height: 100dvh;
    transform: translateX(100%);
    transition: transform 300ms cubic-bezier(0.4, 0, 0.2, 1);
    z-index: var(--z-drawer);
    will-change: transform;
    border-left: 1px solid var(--bg-3);
  }
  #app.combat-open #combat-panel {
    transform: translateX(0);
  }

  #combat-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.32);
    z-index: var(--z-drawer-backdrop);
    opacity: 0;
    pointer-events: none;
    transition: opacity 300ms ease;
  }
  #app.combat-open #combat-backdrop {
    display: block;
    opacity: 1;
    pointer-events: auto;
  }
}
}

/* ============================================
   SECTION: Tab Bar
   ============================================ */
@layer components {

/* Sidebar toggle button */
#sidebar-toggle {
  position: absolute;
  top: 0;
  left: 0;
  width: var(--tab-height);
  height: var(--tab-height);
  min-width: var(--active-floor);
  min-height: var(--active-floor);
  z-index: calc(var(--z-tab-bar) + 1);
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: var(--font-size-xl);
  cursor: pointer;
  transition: color var(--transition-fast);
}
#sidebar-toggle:hover { color: var(--gold); }

#tab-bar {
  grid-column: 1 / -1;
  grid-row: 1;
  display: flex;
  align-items: stretch;
  background: var(--bg-1);
  border-bottom: 1px solid var(--bg-3);
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
  user-select: none;
  z-index: var(--z-tab-bar);
  padding-left: var(--tab-height);
}
#tab-bar::-webkit-scrollbar { display: none; }

.tab {
  display: flex;
  align-items: center;
  gap: calc(var(--space-2) * var(--density-factor));
  padding: 0 calc(var(--space-3) * var(--density-factor));
  min-width: var(--tab-min-width);
  max-width: var(--tab-max-width);
  min-height: var(--active-floor);
  height: 100%;
  font-size: var(--font-size-base);
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--bg-1);
  border-right: 1px solid var(--bg-3);
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: background var(--transition-fast), color var(--transition-fast);
  position: relative;
}
.tab:hover { background: var(--bg-2); color: var(--text-primary); }
.tab.active {
  background: var(--bg-2);
  color: var(--gold-bright);
  box-shadow: inset 0 -2px 0 var(--gold);
}
.tab-label { overflow: hidden; text-overflow: ellipsis; flex: 1; }
.tab-close {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 1.125rem;
  height: 1.125rem;
  border-radius: var(--radius-sm);
  font-size: var(--font-size-lg);
  line-height: 1;
  color: var(--text-muted);
  opacity: 0;
  transition: opacity var(--transition-fast), background var(--transition-fast);
  flex-shrink: 0;
}
.tab:hover .tab-close { opacity: 1; }
.tab-close:hover { background: var(--bg-4); color: var(--red-light); }

/* ============================================
   SECTION: Heat Tracker Bar
   ============================================ */
#heat-bar {
  grid-column: 2 / -1;
  grid-row: 2;
  display: flex;
  align-items: center;
  gap: calc(var(--space-3) * var(--density-factor));
  padding: 0 calc(var(--space-4) * var(--density-factor));
  background: var(--bg-1);
  border-bottom: 1px solid var(--bg-3);
  font-size: var(--font-size-base);
  font-family: var(--font-mono);
  z-index: var(--z-heat-bar);
}
.heat-label { color: var(--text-muted); font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; }
.heat-gauge { display: flex; gap: 3px; height: 0.875rem; /* 14px */ }
.heat-segment {
  width: 3rem;
  height: 100%;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--transition-base);
  border: 1px solid transparent;
}
.heat-segment[data-level="0"] { background: var(--heat-green); opacity: 0.3; }
.heat-segment[data-level="1"] { background: var(--heat-amber); opacity: 0.3; }
.heat-segment[data-level="2"] { background: var(--heat-red); opacity: 0.3; }
.heat-segment.active { opacity: 1; }
.heat-segment[data-level="2"].active { animation: heatPulse 1.5s ease-in-out infinite; }
.heat-status { color: var(--text-secondary); font-weight: 500; }
.heat-status.alarmed { color: var(--red-bright); }

@keyframes heatPulse {
  0%, 100% { opacity: 1; box-shadow: none; }
  50% { opacity: 0.7; box-shadow: 0 0 8px var(--red-bright); }
}

#nav-heat-spacer {
  grid-column: 1;
  grid-row: 2;
  background: var(--bg-1);
  border-bottom: 1px solid var(--bg-3);
  border-right: 1px solid var(--bg-3);
}

/* ============================================
   SECTION: Left Navigation
   ============================================ */
#nav-panel {
  grid-column: 1;
  grid-row: 3;
  background: var(--bg-1);
  border-right: 1px solid var(--bg-3);
  overflow-y: auto;
  overflow-x: hidden;
  padding: var(--space-3) 0;
  position: relative;
}
.nav-title {
  font-family: var(--font-heading);
  font-size: var(--font-size-md);
  font-weight: 600;
  color: var(--gold);
  padding: calc(var(--space-2) * var(--density-factor)) calc(var(--space-4) * var(--density-factor));
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.nav-section { margin-bottom: 2px; }
.nav-section-header {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: calc(var(--space-2) * var(--density-factor)) calc(var(--space-3) * var(--density-factor));
  min-height: max(var(--active-floor), calc(var(--space-5) * var(--density-factor)));
  font-size: var(--font-size-md);
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all var(--transition-fast);
  border-left: 3px solid transparent;
}
.nav-section-header:hover { color: var(--text-primary); background: var(--bg-2); }
.nav-section-header.active {
  color: var(--gold-bright);
  border-left-color: var(--gold);
  background: rgba(201, 168, 76, 0.06);
}
.nav-section-header .nav-icon { font-size: var(--font-size-lg); width: 1.25rem; text-align: center; }
.nav-section-header .nav-chevron {
  margin-left: auto;
  font-size: var(--font-size-xs);
  transition: transform var(--transition-fast);
  color: var(--text-muted);
}
.nav-section-header.expanded .nav-chevron { transform: rotate(90deg); }
.nav-children {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows var(--transition-base);
}
.nav-children.expanded { grid-template-rows: 1fr; }
.nav-children-inner { overflow: hidden; }
.nav-child {
  padding: calc(var(--space-1) * var(--density-factor)) calc(var(--space-3) * var(--density-factor)) calc(var(--space-1) * var(--density-factor)) var(--nav-child-indent);
  min-height: max(var(--active-floor), calc(var(--space-4) * var(--density-factor)));
  display: flex;
  align-items: center;
  font-size: var(--font-size-base);
  color: var(--text-muted);
  cursor: pointer;
  transition: all var(--transition-fast);
}
.nav-child:hover { color: var(--text-primary); background: var(--bg-2); }
.nav-child.active { color: var(--gold-bright); }
.nav-divider { height: 1px; background: var(--bg-3); margin: var(--space-2) var(--space-4); }

#nav-resize {
  position: absolute;
  right: -3px;
  top: 0;
  bottom: 0;
  width: 0.375rem;
  cursor: col-resize;
  z-index: var(--z-nav-resize);
}
#nav-resize:hover, #nav-resize.dragging { background: var(--gold-dim); opacity: 0.5; }

/* -- Sidebar collapsed (icon-bar) mode -- */
#app[data-sidebar="collapsed"] #nav-panel {
  overflow: hidden;
  min-width: 0;
}
#app[data-sidebar="collapsed"] .nav-label,
#app[data-sidebar="collapsed"] .nav-chevron,
#app[data-sidebar="collapsed"] .nav-children,
#app[data-sidebar="collapsed"] .nav-divider {
  opacity: 0;
  pointer-events: none;
  transition: opacity 0ms;
}
#app[data-sidebar="collapsed"] .nav-section-header {
  justify-content: center;
  padding: var(--space-2) var(--space-1);
  border-left-width: 0;
}
#app[data-sidebar="collapsed"] .nav-section-header .nav-icon {
  width: auto;
}
#app[data-sidebar="collapsed"] .nav-title {
  text-align: center;
  padding: var(--space-2) var(--space-1);
  font-size: var(--font-size-lg);
}
#app[data-sidebar="collapsed"] .nav-title .nav-label { display: none; }

/* Bidirectional delay: labels fade in AFTER width expands */
#app:not([data-sidebar="collapsed"]):not([data-sidebar="hidden"]) .nav-label,
#app:not([data-sidebar="collapsed"]):not([data-sidebar="hidden"]) .nav-chevron {
  opacity: 1;
  transition: opacity 150ms 200ms;
}

/* -- Sidebar hidden mode -- */
#app[data-sidebar="hidden"] #nav-panel {
  overflow: hidden;
  min-width: 0;
  visibility: hidden;
  border-right: 0;
}
#app[data-sidebar="hidden"] #nav-resize,
#app[data-sidebar="collapsed"] #nav-resize { display: none; }

/* ============================================
   SECTION: Main Content Area
   ============================================ */
#main-content {
  grid-column: 2;
  grid-row: 3;
  overflow-y: auto;
  overflow-x: hidden;
  padding: clamp(0.75rem, 2vw, 1.5rem) clamp(1rem, 3vw, 2rem) 4rem;
  scroll-behavior: smooth;
}

/* Content width constraint — target prose blocks explicitly */
#main-content > .act-title,
#main-content > .act-duration,
#main-content > .section-title,
#main-content > .subsection-title,
#main-content > .block-read-aloud,
#main-content > .block-dm-note,
#main-content > .block-dm-tip,
#main-content > .block-skill-check,
#main-content > .block-encounter,
#main-content > .block-narrative,
#main-content > .block-vtt-cue,
#main-content > .stat-block,
#main-content > p {
  max-width: min(65ch, 100%);
  margin-inline: auto;
}

/* Conditional blocks keep their left indent */
#main-content > .block-conditional {
  max-width: min(65ch, 100%);
}

/* Tables/stat blocks get wider allowance */
#main-content > .block-table {
  max-width: min(80ch, 100%);
  margin-inline: auto;
}

/* ============================================
   SECTION: Combat Panel
   ============================================ */
#combat-panel {
  grid-column: 3;
  grid-row: 2 / 4;
  background: var(--bg-1);
  border-left: 1px solid var(--bg-3);
  overflow-y: auto;
  overflow-x: hidden;
  min-width: 0;
}

.combat-header {
  position: sticky;
  top: 0;
  background: var(--bg-1);
  padding: calc(var(--space-2) * var(--density-factor)) calc(var(--space-3) * var(--density-factor));
  border-bottom: 1px solid var(--bg-3);
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: var(--z-combat-header);
}
.combat-header h2 {
  font-family: var(--font-heading);
  font-size: var(--font-size-lg);
  color: var(--gold);
  letter-spacing: 0.5px;
}
.combat-close {
  min-width: var(--active-floor); min-height: var(--active-floor);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted); cursor: pointer; border-radius: var(--radius-md); font-size: var(--font-size-2xl);
}
.combat-close:hover { background: var(--bg-3); color: var(--text-primary); }
.combat-section { padding: calc(var(--space-2) * var(--density-factor)) calc(var(--space-3) * var(--density-factor)); border-bottom: 1px solid var(--bg-3); }
.combat-section-title {
  font-family: var(--font-heading);
  font-size: var(--font-size-sm);
  color: var(--gold-dim);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: var(--space-3);
}

/* ============================================
   SECTION: Block Type Styles
   ============================================ */

/* Read-Aloud */
.block-read-aloud {
  background: var(--parchment-bg);
  border-left: 4px solid var(--gold);
  border-radius: var(--radius-md);
  padding: var(--space-5) var(--space-6);
  margin: calc(var(--space-4) * var(--density-factor)) 0;
  font-family: var(--font-read-aloud);
  font-size: var(--font-size-xl);
  line-height: 1.8;
  color: var(--parchment-text);
  font-style: italic;
  position: relative;
}
.block-read-aloud p { margin-bottom: var(--space-3); }
.block-read-aloud p:last-child { margin-bottom: 0; }
.block-read-aloud .present-btn {
  position: absolute;
  top: var(--space-2); right: var(--space-2);
  padding: var(--space-1) var(--space-3);
  font-family: var(--font-mono);
  font-size: var(--font-size-xs); font-weight: 500;
  color: var(--gold);
  background: var(--bg-2);
  border: 1px solid var(--gold-dim);
  border-radius: var(--radius-sm);
  cursor: pointer;
  opacity: 0;
  transition: opacity var(--transition-fast), background var(--transition-fast);
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.block-read-aloud:hover .present-btn { opacity: 1; }
.block-read-aloud .present-btn:hover { background: var(--gold-dim); color: var(--bg-0); }

/* VTT Badge — shows on read-aloud blocks that auto-sync */
.vtt-badge {
  position: absolute; top: var(--space-2); right: 2.5rem;
  font-size: var(--font-size-xs); color: var(--gold); opacity: 0.6;
  pointer-events: none;
}

/* VTT Cue — clickable inline buttons for map/scene transitions */
.block-vtt-cue {
  display: flex; align-items: center; gap: var(--space-2);
  padding: var(--space-2) var(--space-3); margin: calc(var(--space-2) * var(--density-factor)) 0;
  background: rgba(201, 168, 76, 0.08);
  border: 1px solid rgba(201, 168, 76, 0.25);
  border-radius: var(--radius-lg); cursor: pointer;
  transition: background var(--transition-fast);
}
.block-vtt-cue:hover { background: rgba(201, 168, 76, 0.15); }
.block-vtt-cue__icon { font-size: var(--font-size-lg); }
.block-vtt-cue__label {
  font-family: var(--font-mono); font-size: var(--font-size-base);
  color: var(--gold); font-weight: 500;
}

/* DM Note */
.block-dm-note {
  background: var(--bg-2);
  border-left: 3px solid var(--gold-dim);
  border-radius: var(--radius-md);
  margin: calc(var(--space-3) * var(--density-factor)) 0;
  overflow: hidden;
}
.block-dm-note .block-header {
  display: flex; align-items: center; gap: var(--space-2);
  padding: var(--space-3) var(--space-4);
  cursor: pointer;
  font-size: var(--font-size-md); font-weight: 600;
  color: var(--text-secondary);
  transition: color var(--transition-fast);
}
.block-dm-note .block-header:hover { color: var(--text-primary); }
.block-dm-note .block-header .icon { font-size: var(--font-size-lg); }
.block-dm-note .block-header .chevron {
  margin-left: auto; font-size: var(--font-size-xs);
  transition: transform var(--transition-base);
  color: var(--text-muted);
}
.block-dm-note .block-header.expanded .chevron { transform: rotate(90deg); }
.block-dm-note .block-body {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows var(--transition-base);
}
.block-dm-note .block-body.expanded { grid-template-rows: 1fr; }
.block-dm-note .block-body-inner { overflow: hidden; padding: 0 var(--space-4); }
.block-dm-note .block-body.expanded .block-body-inner { padding-bottom: var(--space-4); }
.block-dm-note .block-body-inner p { font-size: var(--font-size-md); color: var(--text-secondary); line-height: 1.7; margin-bottom: var(--space-2); }

/* DM Tip */
.block-dm-tip {
  background: rgba(46, 134, 171, 0.08);
  border-left: 3px solid var(--blue);
  border-radius: var(--radius-md);
  margin: calc(var(--space-3) * var(--density-factor)) 0;
  overflow: hidden;
}
.block-dm-tip .block-header {
  display: flex; align-items: center; gap: var(--space-2);
  padding: var(--space-2) var(--space-4);
  cursor: pointer;
  font-size: var(--font-size-base); font-weight: 500;
  color: var(--blue-bright);
}
.block-dm-tip .block-header .chevron {
  margin-left: auto; font-size: var(--font-size-xs);
  transition: transform var(--transition-base);
}
.block-dm-tip .block-header.expanded .chevron { transform: rotate(90deg); }
.block-dm-tip .block-body {
  display: grid; grid-template-rows: 0fr;
  transition: grid-template-rows var(--transition-base);
}
.block-dm-tip .block-body.expanded { grid-template-rows: 1fr; }
.block-dm-tip .block-body-inner { overflow: hidden; padding: 0 var(--space-4); }
.block-dm-tip .block-body.expanded .block-body-inner { padding-bottom: var(--space-3); }
.block-dm-tip .block-body-inner p { font-size: var(--font-size-base); color: var(--text-secondary); line-height: 1.7; }

/* Skill Check */
.block-skill-check {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  background: var(--bg-2);
  border-radius: var(--radius-lg);
  margin: calc(var(--space-3) * var(--density-factor)) 0;
  border: 1px solid var(--bg-4);
}
.dc-badge {
  display: flex; align-items: center; justify-content: center;
  min-width: 2.625rem; height: 2.625rem;
  background: var(--bg-3);
  border: 2px solid var(--gold-dim);
  border-radius: var(--radius-lg);
  font-family: var(--font-mono);
  font-size: var(--font-size-2xl); font-weight: 600;
  color: var(--gold-bright);
  flex-shrink: 0;
  text-align: center;
  line-height: 1.2;
}
.skill-check-info { flex: 1; }
.skill-check-info .check-name { font-weight: 600; font-size: var(--font-size-md); color: var(--text-primary); }
.skill-check-info .check-details { font-size: var(--font-size-base); color: var(--text-secondary); margin-top: 2px; }

/* Encounter */
.block-encounter {
  background: rgba(192, 57, 43, 0.06);
  border: 1px solid var(--red-dark);
  border-left: 4px solid var(--red);
  border-radius: var(--radius-md);
  padding: var(--space-4) var(--space-4);
  margin: calc(var(--space-4) * var(--density-factor)) 0;
}
.block-encounter .encounter-title {
  font-family: var(--font-heading);
  font-size: var(--font-size-md); font-weight: 600;
  color: var(--red-bright);
  margin-bottom: var(--space-2);
  letter-spacing: 0.3px;
}
.block-encounter p { font-size: var(--font-size-md); color: var(--text-secondary); }

/* Narrative */
.block-narrative { margin: calc(var(--space-3) * var(--density-factor)) 0; font-size: var(--font-size-lg); color: var(--text-primary); line-height: 1.7; }
.block-narrative p { margin-bottom: var(--space-3); }
.block-narrative strong { color: var(--gold-bright); font-weight: 600; }

/* Conditional */
.block-conditional {
  margin: calc(var(--space-3) * var(--density-factor)) 0 calc(var(--space-3) * var(--density-factor)) var(--space-4);
  border-left: 2px solid var(--bg-4);
  overflow: hidden;
}
.block-conditional .block-header {
  display: flex; align-items: center; gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  cursor: pointer;
  font-size: var(--font-size-md);
  color: var(--text-secondary);
  font-style: italic;
}
.block-conditional .block-header .chevron {
  margin-left: auto; font-size: var(--font-size-xs);
  transition: transform var(--transition-base);
}
.block-conditional .block-header.expanded .chevron { transform: rotate(90deg); }
.block-conditional .block-body {
  display: grid; grid-template-rows: 0fr;
  transition: grid-template-rows var(--transition-base);
}
.block-conditional .block-body.expanded { grid-template-rows: 1fr; }
.block-conditional .block-body-inner { overflow: hidden; padding: 0 var(--space-3); }
.block-conditional .block-body.expanded .block-body-inner { padding-bottom: var(--space-3); }

/* Table */
.block-table { margin: var(--space-4) 0; overflow-x: auto; border-radius: var(--radius-lg); border: 1px solid var(--bg-4); }
.block-table table { width: 100%; border-collapse: collapse; font-size: var(--font-size-md); }
.block-table th {
  background: var(--bg-3);
  padding: var(--space-2) var(--space-3);
  text-align: left;
  font-weight: 600;
  color: var(--gold);
  font-family: var(--font-mono);
  font-size: var(--font-size-sm);
  letter-spacing: 0.5px;
  text-transform: uppercase;
  border-bottom: 2px solid var(--gold-dim);
}
.block-table td { padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--bg-3); color: var(--text-secondary); }
.block-table tr:last-child td { border-bottom: none; }
.block-table tr:hover td { background: var(--bg-2); }

/* ============================================
   SECTION: Content Typography
   ============================================ */
.act-title {
  font-family: var(--font-heading);
  font-size: 1.5rem; font-weight: 700;
  color: var(--gold-bright);
  margin-bottom: var(--space-1);
  letter-spacing: 1px;
}
.act-duration {
  font-family: var(--font-mono);
  font-size: var(--font-size-base); color: var(--text-muted);
  margin-bottom: var(--space-6);
}
.section-title {
  font-family: var(--font-heading);
  font-size: 1.0625rem; font-weight: 600;
  color: var(--text-heading);
  margin: 1.75rem 0 var(--space-3);
  padding-bottom: var(--space-2);
  border-bottom: 1px solid var(--bg-3);
}
.subsection-title {
  font-family: var(--font-heading);
  font-size: var(--font-size-lg); font-weight: 600;
  color: var(--gold);
  margin: var(--space-5) 0 var(--space-2);
}

/* ============================================
   SECTION: Entity Tooltips
   ============================================ */
.entity-npc { color: var(--blue-bright); border-bottom: 1px dotted var(--blue); cursor: help; }
.entity-dc { font-family: var(--font-mono); font-weight: 600; color: var(--gold-bright); cursor: help; }
.entity-spell { color: var(--purple-light); border-bottom: 1px dotted var(--purple); cursor: help; }

#tooltip {
  position: fixed; z-index: var(--z-tooltip);
  max-width: 20rem; padding: var(--space-3) var(--space-4);
  background: var(--bg-3);
  border: 1px solid var(--bg-4);
  border-radius: var(--radius-lg);
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  font-size: var(--font-size-base); line-height: 1.5;
  color: var(--text-primary);
  pointer-events: none;
  display: none; opacity: 0;
  transition: opacity var(--transition-fast);
}
#tooltip.visible { display: block; opacity: 1; }
#tooltip .tooltip-title { font-weight: 600; color: var(--gold-bright); margin-bottom: var(--space-1); }
#tooltip .tooltip-subtitle { font-size: var(--font-size-sm); color: var(--text-muted); margin-bottom: var(--space-2); }
#tooltip .tooltip-body { color: var(--text-secondary); }

/* ============================================
   SECTION: Search Overlay
   ============================================ */
#search-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  z-index: var(--z-search);
  display: none;
  align-items: flex-start; justify-content: center;
  padding-top: 15vh;
}
#search-overlay.open { display: flex; }
#search-box {
  width: 35rem; max-height: 30rem;
  background: var(--bg-2);
  border: 1px solid var(--bg-4);
  border-radius: 0.625rem;
  box-shadow: 0 16px 48px rgba(0,0,0,0.6);
  overflow: hidden;
  display: flex; flex-direction: column;
}
#search-input-wrap {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-4) var(--space-4);
  border-bottom: 1px solid var(--bg-3);
}
#search-input-wrap .search-icon { color: var(--text-muted); font-size: var(--font-size-2xl); }
#search-input {
  flex: 1; background: none; border: none; outline: none;
  font-family: var(--font-body);
  font-size: var(--font-size-xl); color: var(--text-primary);
}
#search-input::placeholder { color: var(--text-muted); }
#search-results { overflow-y: auto; flex: 1; padding: var(--space-2); }
.search-group-label {
  font-family: var(--font-mono);
  font-size: var(--font-size-xs); font-weight: 600;
  color: var(--text-muted);
  letter-spacing: 1px; text-transform: uppercase;
  padding: var(--space-2) var(--space-2) var(--space-1);
}
.search-result {
  padding: var(--space-2) var(--space-3); border-radius: var(--radius-lg);
  cursor: pointer;
  transition: background var(--transition-fast);
}
.search-result:hover, .search-result.selected { background: var(--bg-3); }
.search-result-title { font-size: var(--font-size-md); font-weight: 500; color: var(--text-primary); }
.search-result-preview {
  font-size: var(--font-size-base); color: var(--text-muted); margin-top: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.search-result mark { background: var(--gold-dim); color: var(--gold-light); border-radius: 2px; padding: 0 2px; }
.search-empty { padding: var(--space-6); text-align: center; color: var(--text-muted); font-size: var(--font-size-md); }
.search-category {
  font-family: var(--font-mono);
  font-size: var(--font-size-xs); font-weight: 600;
  color: var(--text-muted);
  letter-spacing: 1px; text-transform: uppercase;
  padding: var(--space-3) var(--space-2) var(--space-1);
}
.search-result-item {
  padding: var(--space-2) var(--space-3); border-radius: var(--radius-lg);
  cursor: pointer; display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-2);
  transition: background var(--transition-fast);
}
.search-result-item:hover, .search-result-item.selected { background: var(--bg-3); }
.search-result-item .search-result-title { font-size: var(--font-size-md); font-weight: 500; color: var(--text-primary); }
.search-result-item .search-result-label {
  font-size: var(--font-size-sm); color: var(--text-muted); font-family: var(--font-mono);
}
.search-result-item .search-result-preview {
  width: 100%; font-size: var(--font-size-base); color: var(--text-muted); margin-top: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* ============================================
   SECTION: Presentation Mode
   ============================================ */
#presentation-overlay {
  position: fixed; inset: 0;
  background: rgba(10, 12, 18, 0.94);
  z-index: var(--z-presentation);
  display: none;
  flex-direction: column;
  align-items: center; justify-content: center;
  padding: var(--space-12) var(--space-12) 6rem;
}
#presentation-overlay.open { display: flex; }
#presentation-frame {
  max-width: 45rem; width: 100%;
  max-height: calc(100vh - 12.5rem);
  overflow-y: auto;
  padding: var(--space-12) 3.5rem;
  position: relative;
  border: 2px solid var(--gold-dim);
  scrollbar-width: thin;
  scrollbar-color: var(--gold-dim) transparent;
}
#presentation-frame::-webkit-scrollbar { width: 4px; }
#presentation-frame::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 2px; }
#presentation-frame::-webkit-scrollbar-track { background: transparent; }
#presentation-frame::before {
  content: '';
  position: absolute; inset: -12px;
  border: 1px solid var(--gold-dim);
  border-radius: 2px;
  pointer-events: none;
}
#presentation-frame::after {
  content: '\u25C6';
  position: absolute;
  top: calc(-1 * var(--space-5)); left: 50%;
  transform: translateX(-50%);
  color: var(--gold);
  font-size: var(--font-size-2xl); font-style: normal;
}
#presentation-content {
  font-family: var(--font-read-aloud);
  font-size: 1.625rem; line-height: 1.8;
  color: var(--parchment-text);
  font-style: italic;
  text-align: center;
}
#presentation-content p {
  margin-bottom: var(--space-5);
  opacity: 0;
  animation: presentFadeIn 0.6s ease forwards;
}
#presentation-content p:last-child { margin-bottom: 0; }

/* Stagger animations for visible paragraphs */
#presentation-content p:nth-child(1) { animation-delay: 0.15s; }
#presentation-content p:nth-child(2) { animation-delay: 0.35s; }
#presentation-content p:nth-child(3) { animation-delay: 0.55s; }
#presentation-content p:nth-child(4) { animation-delay: 0.75s; }
#presentation-content p:nth-child(5) { animation-delay: 0.95s; }
#presentation-content p:nth-child(n+6) { animation-delay: 1.1s; }

/* Non-read-aloud interstitials in presentation */
.present-interstitial {
  font-family: var(--font-body);
  font-style: normal;
  font-size: var(--font-size-lg);
  text-align: left;
  color: var(--text-secondary);
  background: var(--bg-2);
  border: 1px solid var(--bg-4);
  border-radius: var(--radius-lg);
  padding: var(--space-4) 1.125rem;
  margin: var(--space-6) 0;
  animation: presentFadeIn 0.4s ease forwards;
  opacity: 0;
}
.present-interstitial .interstitial-type {
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: var(--space-2);
}
.present-interstitial .interstitial-type.type-dm-note { color: var(--gold); }
.present-interstitial .interstitial-type.type-skill-check { color: var(--gold-bright); }
.present-interstitial .interstitial-type.type-encounter { color: var(--red-bright); }
.present-interstitial .interstitial-dc {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: var(--font-size-2xl); font-weight: 600;
  color: var(--gold-bright);
  background: var(--bg-3);
  border: 2px solid var(--gold-dim);
  border-radius: var(--radius-md);
  padding: 2px var(--space-2);
  margin-right: var(--space-2);
}

@keyframes presentFadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

#presentation-nav {
  display: flex; align-items: center; gap: var(--space-3);
  margin-top: var(--space-5);
}
#presentation-nav button {
  padding: var(--space-2) var(--space-5);
  font-family: var(--font-body);
  font-size: var(--font-size-md); font-weight: 500;
  border: 1px solid var(--gold-dim);
  border-radius: var(--radius-md);
  background: var(--bg-3);
  color: var(--gold);
  cursor: pointer;
  transition: all var(--transition-fast);
}
#presentation-nav button:hover { background: var(--gold-dim); color: var(--bg-0); }
#presentation-nav button:disabled { opacity: 0.3; cursor: default; }
#presentation-nav button:disabled:hover { background: var(--bg-3); color: var(--gold); }
#presentation-counter {
  font-family: var(--font-mono); font-size: var(--font-size-sm); color: var(--text-muted);
}
#presentation-hints {
  position: absolute; bottom: var(--space-6); left: 50%; transform: translateX(-50%);
  font-family: var(--font-mono); font-size: var(--font-size-sm); color: var(--text-muted);
}
#presentation-hints kbd {
  display: inline-block; padding: 2px var(--space-2);
  background: var(--bg-3); border: 1px solid var(--bg-4);
  border-radius: var(--radius-sm); font-family: var(--font-mono);
  font-size: var(--font-size-xs); color: var(--text-secondary);
}

/* ============================================
   SECTION: Brazier Animations
   ============================================ */
.braziers-row { display: flex; gap: var(--space-3); justify-content: center; margin: var(--space-2) 0 var(--space-4); }
.brazier {
  width: 3rem; height: 3.5rem;
  display: flex; flex-direction: column; align-items: center;
  cursor: pointer; position: relative;
}
.brazier-bowl {
  width: 2rem; height: 1.25rem;
  background: var(--bg-4);
  border-radius: 0 0 0.75rem 0.75rem;
  border: 2px solid var(--text-muted);
  border-top: none;
  position: relative;
  margin-top: auto;
}
.brazier-flame {
  position: absolute; bottom: 16px; left: 50%;
  transform: translateX(-50%);
  width: 16px; height: 24px;
  background: var(--brazier-blue);
  border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  filter: blur(1px); opacity: 0.9;
  animation: flameDance 1.2s ease-in-out infinite alternate;
  box-shadow: 0 0 12px var(--brazier-blue), 0 0 24px rgba(74, 158, 255, 0.3);
}
.brazier:nth-child(2) .brazier-flame { animation-delay: 0.2s; }
.brazier:nth-child(3) .brazier-flame { animation-delay: 0.4s; }
.brazier:nth-child(4) .brazier-flame { animation-delay: 0.6s; }
.brazier:nth-child(5) .brazier-flame { animation-delay: 0.8s; }

.brazier.extinguished .brazier-flame {
  background: var(--text-muted);
  height: 8px; width: 8px;
  opacity: 0.3; filter: blur(3px);
  box-shadow: none;
  animation: smokeWisp 2s ease-in-out infinite;
}
.brazier.extinguished .brazier-bowl { border-color: var(--text-muted); opacity: 0.5; }

@keyframes flameDance {
  0% { height: 22px; width: 14px; opacity: 0.85; }
  25% { height: 26px; width: 16px; opacity: 1; }
  50% { height: 20px; width: 15px; opacity: 0.9; }
  75% { height: 28px; width: 13px; opacity: 0.95; }
  100% { height: 24px; width: 16px; opacity: 0.88; }
}
@keyframes smokeWisp {
  0%, 100% { opacity: 0.3; transform: translateX(-50%) translateY(0); }
  50% { opacity: 0.1; transform: translateX(-50%) translateY(-6px); }
}

.immunity-meter { display: flex; gap: 2px; height: 0.5rem; margin: var(--space-2) 0; }
.immunity-segment { flex: 1; border-radius: 2px; transition: all var(--transition-base); }
.immunity-segment.active { background: var(--brazier-blue); }
.immunity-segment.inactive { background: var(--bg-4); }

/* HP Bars */
.hp-bar-wrap {
  height: 1rem; background: var(--bg-3);
  border-radius: var(--radius-md); overflow: hidden;
  position: relative; margin: var(--space-1) 0;
}
.hp-bar-fill {
  height: 100%; border-radius: var(--radius-md);
  transition: width var(--transition-base), background var(--transition-base);
}
.hp-bar-fill.healthy { background: var(--heat-green); }
.hp-bar-fill.wounded { background: var(--heat-amber); }
.hp-bar-fill.critical { background: var(--red); animation: criticalPulse 1s ease-in-out infinite; }
.hp-bar-label {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: var(--font-size-xs); font-weight: 600;
  color: var(--text-primary); text-shadow: 0 1px 2px rgba(0,0,0,0.8);
}
.hp-phase-marker {
  position: absolute; top: 0; bottom: 0;
  width: 2px; background: var(--gold); opacity: 0.6;
}
@keyframes criticalPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

/* Initiative tracker */
.init-list { list-style: none; }
.init-item {
  display: flex; align-items: center; gap: var(--space-2);
  padding: var(--space-2) var(--space-2); border-radius: var(--radius-md); font-size: var(--font-size-base);
  transition: background var(--transition-fast);
}
.init-item.active-turn { background: rgba(201, 168, 76, 0.12); border-left: 3px solid var(--gold); }
.init-value { font-family: var(--font-mono); font-weight: 600; width: 1.5rem; text-align: center; color: var(--text-muted); }
.init-input {
  font-family: var(--font-mono); font-weight: 600; width: 2.25rem; text-align: center;
  background: var(--bg-3); border: 1px solid var(--bg-4); border-radius: var(--radius-sm);
  color: var(--gold); padding: 2px 0; font-size: var(--font-size-base);
}
.init-input:focus { outline: 1px solid var(--gold); border-color: var(--gold); }
.init-input::placeholder { color: var(--text-muted); opacity: 0.5; }
.init-name { flex: 1; font-weight: 500; }
.condition-badge { font-size: var(--font-size-xs); padding: 1px var(--space-2); border-radius: var(--radius-sm); font-weight: 500; }
.condition-badge.dominated { background: var(--red-dark); color: var(--red-light); }

/* Dominate toggle */
.dominate-toggle {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-3); background: var(--bg-3); border-radius: var(--radius-lg); margin: var(--space-2) 0;
}
.dominate-toggle.active { background: rgba(192, 57, 43, 0.15); border: 1px solid var(--red-dark); }
.dominate-switch {
  width: 2.25rem; height: 1.25rem;
  background: var(--bg-4); border-radius: 0.625rem;
  cursor: pointer; position: relative;
  transition: background var(--transition-fast);
}
.dominate-switch.active { background: var(--red); }
.dominate-switch::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 1rem; height: 1rem;
  background: var(--text-primary); border-radius: 50%;
  transition: transform var(--transition-fast);
}
.dominate-switch.active::after { transform: translateX(1rem); }

/* ============================================
   SECTION: Stat Block
   ============================================ */
.stat-block {
  background: var(--bg-2); border: 1px solid var(--bg-4);
  border-top: 3px solid var(--red); border-radius: var(--radius-md);
  padding: var(--space-4); margin: var(--space-3) 0;
}
.stat-block-name { font-family: var(--font-heading); font-size: 1.125rem; color: var(--red-bright); margin-bottom: 2px; }
.stat-block-type { font-size: var(--font-size-base); font-style: italic; color: var(--text-muted); margin-bottom: var(--space-3); }
.stat-block-divider { border: none; border-top: 1px solid var(--red-dark); margin: var(--space-3) 0; }
.stat-block-row { font-size: var(--font-size-md); color: var(--text-secondary); margin: var(--space-1) 0; }
.stat-block-row strong { color: var(--text-primary); }
.stat-block-abilities {
  display: grid; grid-template-columns: repeat(6, 1fr);
  gap: var(--space-1); text-align: center; margin: var(--space-3) 0;
}
.stat-block-abilities .ability-label { font-family: var(--font-mono); font-size: var(--font-size-xs); font-weight: 600; color: var(--gold); letter-spacing: 0.5px; }
.stat-block-abilities .ability-value { font-family: var(--font-mono); font-size: var(--font-size-md); color: var(--text-primary); }
.stat-block-abilities .ability-mod { font-size: var(--font-size-sm); color: var(--text-muted); }
.stat-block-action { margin: var(--space-2) 0; }
.stat-block-action .action-name { font-weight: 600; font-style: italic; color: var(--text-primary); }

/* ============================================
   SECTION: Welcome Tab
   ============================================ */
.welcome-content { max-width: 40rem; margin: 0 auto; }
.welcome-title {
  font-family: var(--font-heading);
  font-size: 2rem; color: var(--gold-bright);
  text-align: center; margin-bottom: var(--space-1);
}
.welcome-subtitle {
  font-family: var(--font-read-aloud);
  font-size: var(--font-size-2xl); color: var(--text-muted);
  text-align: center; font-style: italic; margin-bottom: var(--space-8);
}
.welcome-section-title {
  font-family: var(--font-heading);
  font-size: var(--font-size-lg); color: var(--gold);
  margin: var(--space-6) 0 var(--space-2); letter-spacing: 0.5px;
}
.shortcut-grid {
  display: grid; grid-template-columns: auto 1fr;
  gap: var(--space-2) var(--space-4); font-size: var(--font-size-md);
}
.shortcut-grid kbd {
  display: inline-block; padding: 2px var(--space-2);
  background: var(--bg-3); border: 1px solid var(--bg-4);
  border-radius: var(--radius-sm); font-family: var(--font-mono);
  font-size: var(--font-size-sm); color: var(--text-secondary);
  text-align: center; min-width: 3rem;
}

}

@layer utilities {
/* Utility classes */
.flex { display: flex; }
.gap-4 { gap: var(--space-1); }
.gap-8 { gap: var(--space-2); }
.mt-4 { margin-top: var(--space-1); }
.mt-8 { margin-top: var(--space-2); }
.mt-16 { margin-top: var(--space-4); }
.mb-8 { margin-bottom: var(--space-2); }
.text-muted { color: var(--text-muted); }
.text-xs { font-size: var(--font-size-sm); }
.text-sm { font-size: var(--font-size-base); }
.font-mono { font-family: var(--font-mono); }
}

/* Buttons */
@layer components {
.btn {
  display: inline-flex; align-items: center; gap: var(--space-2);
  padding: var(--space-2) var(--space-3); min-height: var(--active-floor); font-family: var(--font-body);
  font-size: var(--font-size-base); font-weight: 500;
  border: 1px solid var(--bg-4); border-radius: var(--radius-md);
  background: var(--bg-3); color: var(--text-secondary);
  cursor: pointer; transition: all var(--transition-fast);
}
.btn:hover { background: var(--bg-4); color: var(--text-primary); }
.btn--gold { border-color: var(--gold-dim); color: var(--gold); }
.btn--gold:hover { background: var(--gold-dim); color: var(--bg-0); }
.btn--danger { border-color: var(--red-dark); color: var(--red-bright); }
.btn--danger:hover { background: var(--red-dark); }
.btn--sm { padding: var(--space-1) var(--space-2); font-size: var(--font-size-sm); }
#vtt-controller-btn {
  font-size: var(--font-size-base);
  padding: var(--space-1) var(--space-3);
}

/* Inputs */
.input {
  padding: var(--space-2) var(--space-3); font-family: var(--font-body); font-size: var(--font-size-base);
  background: var(--bg-3); border: 1px solid var(--bg-4);
  border-radius: var(--radius-md); color: var(--text-primary); outline: none;
}
.input:focus { border-color: var(--gold-dim); }
.input-sm { padding: var(--space-1) var(--space-2); font-size: var(--font-size-sm); width: 3.75rem; }

/* Checklists */
.checklist-item {
  display: flex; align-items: flex-start; gap: var(--space-2);
  padding: var(--space-1) 0; font-size: var(--font-size-md); color: var(--text-secondary);
}
.checklist-item input[type="checkbox"] { accent-color: var(--gold); margin-top: 3px; }
.checklist-item.checked { color: var(--text-muted); text-decoration: line-through; }

/* Noise & Vignette */
#noise-overlay {
  position: fixed; inset: 0; pointer-events: none; z-index: var(--z-noise);
  opacity: 0.03;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-repeat: repeat; background-size: 256px 256px;
}
#vignette-overlay {
  position: fixed; inset: 0; pointer-events: none; z-index: var(--z-vignette);
  background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.4) 100%);
}

/* ---- Scale Control ---- */
.scale-control {
  position: relative;
  margin-left: auto;
}
.scale-control__toggle {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  padding: var(--space-1) var(--space-2);
  background: transparent;
  border: 1px solid var(--bg-3);
  border-radius: var(--radius-md);
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: var(--font-size-sm);
  cursor: pointer;
  transition: color var(--transition-fast), border-color var(--transition-fast);
}
.scale-control__toggle:hover {
  color: var(--text-secondary);
  border-color: var(--bg-4);
}
.scale-control__icon {
  font-size: var(--font-size-lg);
}
.scale-control__popover {
  position: absolute;
  bottom: calc(100% + var(--space-2));
  right: 0;
  z-index: var(--z-scale-popover);
  background: var(--bg-2);
  border: 1px solid var(--bg-4);
  border-radius: var(--radius-lg);
  padding: var(--space-3);
  min-width: 12rem;
  box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.4);
}
.scale-control__popover[hidden] { display: none; }
.scale-control__label {
  display: block;
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05rem;
  color: var(--text-muted);
  margin-bottom: var(--space-2);
}
.scale-control__slider {
  width: 100%;
  accent-color: var(--gold);
  cursor: pointer;
}
.scale-control__readout {
  display: flex;
  justify-content: space-between;
  font-family: var(--font-mono);
  font-size: var(--font-size-2xs);
  color: var(--text-muted);
  margin-top: var(--space-1);
  margin-bottom: var(--space-2);
}
#scale-readout {
  color: var(--gold);
  font-weight: 600;
}
.scale-control__reset {
  width: 100%;
  text-align: center;
}
}
</style>
<script>
// Blocking script: read UI preferences from localStorage before first paint (FOUC prevention)
(function() {
  try {
    var sb = localStorage.getItem('dm-sidebar-state');
    if (sb) document.documentElement.dataset.sidebar = sb;
    var d = localStorage.getItem('ui-density');
    if (d) document.documentElement.dataset.density = d;
  } catch(e) {}
})();
</script>
</head>
<body>

<div id="app">
  <button id="sidebar-toggle" class="sidebar-toggle"
    aria-label="Collapse sidebar" aria-expanded="true"
    aria-controls="nav-panel">&#9776;</button>
  <div id="tab-bar"></div>
  <div id="nav-heat-spacer"></div>
  <div id="heat-bar">
    <span class="heat-label">Heat</span>
    <div class="heat-gauge">
      <div class="heat-segment active" data-level="0"></div>
      <div class="heat-segment" data-level="1"></div>
      <div class="heat-segment" data-level="2"></div>
    </div>
    <span class="heat-status" id="heat-status">Unnoticed</span>
    <div class="scale-control" id="scale-control">
      <button class="scale-control__toggle" id="scale-toggle"
              aria-label="Adjust UI scale" title="UI Scale">
        <span class="scale-control__icon">&#9881;</span>
        <span class="scale-control__value" id="scale-value">100%</span>
      </button>
      <div class="scale-control__popover" id="scale-popover" hidden>
        <label class="scale-control__label" for="scale-slider">UI Scale</label>
        <input type="range" id="scale-slider" class="scale-control__slider"
               min="0.75" max="1.5" step="0.05" value="1">
        <div class="scale-control__readout">
          <span>75%</span><span id="scale-readout">100%</span><span>150%</span>
        </div>
        <button class="btn btn--sm scale-control__reset" id="scale-reset">Reset</button>
      </div>
    </div>
    <button class="btn btn--sm" id="density-toggle" aria-label="Toggle compact mode" title="Density">&#9638;</button>
    <button class="btn btn--sm" id="vtt-controller-btn" onclick="window.open('controller/index.html','vtt-controller','width=520,height=900')">VTT Controller &#8599;</button>
  </div>
  <div id="nav-panel">
    <div id="nav-resize"></div>
    <div id="nav-tree"></div>
  </div>
  <div id="main-content"></div>
  <div id="combat-backdrop"></div>
  <div id="combat-panel"></div>
</div>

<div id="tooltip"></div>

<div id="search-overlay">
  <div id="search-box">
    <div id="search-input-wrap">
      <span class="search-icon">&#8984;K</span>
      <input type="text" id="search-input" placeholder="Search acts, NPCs, spells, DCs..." autofocus>
    </div>
    <div id="search-results"></div>
  </div>
</div>

<div id="presentation-overlay">
  <div id="presentation-frame">
    <div id="presentation-content"></div>
  </div>
  <div id="presentation-nav">
    <button id="present-prev" disabled>&larr; Back</button>
    <span id="presentation-counter">1 / 1</span>
    <button id="present-next">Next &rarr;</button>
  </div>
  <div id="presentation-hints"><kbd>Esc</kbd> close &nbsp; <kbd>&larr;</kbd><kbd>&rarr;</kbd> navigate &nbsp; <kbd>Space</kbd> next</div>
</div>

<div id="noise-overlay"></div>
<div id="vignette-overlay"></div>


<script type="module" src="dm-guide/js/main.js"></script>
<script type="module">
  import { initScaleControl } from './shared/scale-control.js';
  initScaleControl();
</script>
</body>
</html>
