<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DM Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400;1,600&family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================
   SECTION: CSS Reset & Custom Properties
   ============================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* Elevation backgrounds (darkest to lightest) */
  --bg-0: #0D0F14;
  --bg-1: #141820;
  --bg-2: #1A1F2B;
  --bg-3: #212738;
  --bg-4: #2A3148;

  /* Gold accent spectrum */
  --gold-dim: #8B7435;
  --gold: #C9A84C;
  --gold-bright: #E8C55A;
  --gold-glow: #F5D76E;
  --gold-light: #FFE89A;

  /* Parchment (dark-mode adapted read-aloud) */
  --parchment-bg: #2C2518;
  --parchment-text: #E8DCC8;
  --parchment-border: #5C4A2A;

  /* Danger / Red */
  --red-dark: #5C1A1A;
  --red: #C0392B;
  --red-bright: #E74C3C;
  --red-light: #FF6B6B;

  /* Info / Blue */
  --blue-dark: #1A3A4A;
  --blue: #2E86AB;
  --blue-bright: #48B5E0;

  /* Magic / Purple */
  --purple: #7E57C2;
  --purple-light: #B39DDB;
  --purple-bright: #CE93D8;

  /* Heat tracker */
  --heat-green: #27AE60;
  --heat-amber: #E8A84C;
  --heat-red: #E74C3C;

  /* Brazier colors */
  --brazier-blue: #4A9EFF;
  --brazier-purple: #7B68EE;
  --brazier-amber: #E8A84C;
  --brazier-red: #C0392B;
  --brazier-dead: #3A3A3A;

  /* Text hierarchy */
  --text-primary: #E0E0E0;
  --text-secondary: #A0A0A8;
  --text-muted: #6B6B78;
  --text-heading: #E8C55A;

  /* Typography */
  --font-heading: 'Cinzel', serif;
  --font-read-aloud: 'Crimson Text', serif;
  --font-body: 'Inter', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;

  /* Layout */
  --nav-width: 17.5rem;     /* 280px */
  --combat-width: 22.5rem;  /* 360px */
  --tab-height: 2.375rem;   /* 38px */
  --heat-height: 2rem;      /* 32px */

  /* Spacing tokens (4px grid) */
  --space-1: 0.25rem;   /* 4px */
  --space-2: 0.5rem;    /* 8px */
  --space-3: 0.75rem;   /* 12px */
  --space-4: 1rem;      /* 16px */
  --space-5: 1.25rem;   /* 20px */
  --space-6: 1.5rem;    /* 24px */
  --space-8: 2rem;      /* 32px */
  --space-10: 2.5rem;   /* 40px */
  --space-12: 3rem;     /* 48px */
  --space-16: 4rem;     /* 64px */

  /* Typography tokens */
  --font-size-2xs: 0.5625rem;  /* 9px */
  --font-size-xs: 0.625rem;    /* 10px */
  --font-size-sm: 0.6875rem;   /* 11px */
  --font-size-base: 0.75rem;   /* 12px */
  --font-size-md: 0.8125rem;   /* 13px */
  --font-size-lg: 0.875rem;    /* 14px */
  --font-size-xl: 0.9375rem;   /* 15px */
  --font-size-2xl: 1rem;       /* 16px */
  --font-size-heading-hero: 2.625rem; /* 42px */

  /* Border radii */
  --radius-sm: 0.1875rem; /* 3px */
  --radius-md: 0.25rem;   /* 4px */
  --radius-lg: 0.375rem;  /* 6px */
  --radius-xl: 0.5rem;    /* 8px */

  /* Component tokens */
  --nav-child-indent: 2.75rem; /* 44px */
  --tab-min-width: 7.5rem;     /* 120px */
  --tab-max-width: 12.5rem;    /* 200px */
  --scrollbar-size: 0.5rem;    /* 8px */

  /* Transitions */
  --transition-fast: 150ms ease;
  --transition-base: 250ms ease;
  --transition-slow: 400ms ease;
}

html { font-size: 0.875rem; }
body {
  font-family: var(--font-body);
  background: var(--bg-0);
  color: var(--text-primary);
  line-height: 1.65;
  letter-spacing: 0.01em;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
}

/* Scrollbar styling */
::-webkit-scrollbar { width: var(--scrollbar-size); height: var(--scrollbar-size); }
::-webkit-scrollbar-track { background: var(--bg-1); }
::-webkit-scrollbar-thumb { background: var(--bg-4); border-radius: var(--radius-md); }
::-webkit-scrollbar-thumb:hover { background: var(--gold-dim); }

/* ============================================
   SECTION: App Layout (CSS Grid)
   ============================================ */
#app {
  display: grid;
  grid-template-rows: var(--tab-height) var(--heat-height) 1fr;
  grid-template-columns: var(--nav-width) minmax(0, 1fr) 0px;
  height: 100vh;
  width: 100vw;
  overflow: hidden;
  position: relative;
}
#app.combat-open {
  grid-template-columns: var(--nav-width) minmax(0, 1fr) var(--combat-width);
}
#app.nav-collapsed {
  grid-template-columns: 0px minmax(0, 1fr) 0px;
}
#app.nav-collapsed.combat-open {
  grid-template-columns: 0px minmax(0, 1fr) var(--combat-width);
}

/* ============================================
   SECTION: Tab Bar
   ============================================ */
#tab-bar {
  grid-column: 1 / -1;
  grid-row: 1;
  display: flex;
  align-items: stretch;
  background: var(--bg-1);
  border-bottom: 1px solid var(--bg-3);
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
  user-select: none;
  z-index: 100;
}
#tab-bar::-webkit-scrollbar { display: none; }

.tab {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: 0 var(--space-3);
  min-width: var(--tab-min-width);
  max-width: var(--tab-max-width);
  height: 100%;
  font-size: var(--font-size-base);
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--bg-1);
  border-right: 1px solid var(--bg-3);
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: background var(--transition-fast), color var(--transition-fast);
  position: relative;
}
.tab:hover { background: var(--bg-2); color: var(--text-primary); }
.tab.active {
  background: var(--bg-2);
  color: var(--gold-bright);
  box-shadow: inset 0 -2px 0 var(--gold);
}
.tab-label { overflow: hidden; text-overflow: ellipsis; flex: 1; }
.tab-close {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 1.125rem;
  height: 1.125rem;
  border-radius: var(--radius-sm);
  font-size: var(--font-size-lg);
  line-height: 1;
  color: var(--text-muted);
  opacity: 0;
  transition: opacity var(--transition-fast), background var(--transition-fast);
  flex-shrink: 0;
}
.tab:hover .tab-close { opacity: 1; }
.tab-close:hover { background: var(--bg-4); color: var(--red-light); }

/* ============================================
   SECTION: Heat Tracker Bar
   ============================================ */
#heat-bar {
  grid-column: 2 / -1;
  grid-row: 2;
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: 0 var(--space-4);
  background: var(--bg-1);
  border-bottom: 1px solid var(--bg-3);
  font-size: var(--font-size-base);
  font-family: var(--font-mono);
  z-index: 90;
}
.heat-label { color: var(--text-muted); font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; }
.heat-gauge { display: flex; gap: 3px; height: var(--font-size-lg); }
.heat-segment {
  width: 3rem;
  height: 100%;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--transition-base);
  border: 1px solid transparent;
}
.heat-segment[data-level="0"] { background: var(--heat-green); opacity: 0.3; }
.heat-segment[data-level="1"] { background: var(--heat-amber); opacity: 0.3; }
.heat-segment[data-level="2"] { background: var(--heat-red); opacity: 0.3; }
.heat-segment.active { opacity: 1; }
.heat-segment[data-level="2"].active { animation: heatPulse 1.5s ease-in-out infinite; }
.heat-status { color: var(--text-secondary); font-weight: 500; }
.heat-status.alarmed { color: var(--red-bright); }

@keyframes heatPulse {
  0%, 100% { opacity: 1; box-shadow: none; }
  50% { opacity: 0.7; box-shadow: 0 0 8px var(--red-bright); }
}

#nav-heat-spacer {
  grid-column: 1;
  grid-row: 2;
  background: var(--bg-1);
  border-bottom: 1px solid var(--bg-3);
  border-right: 1px solid var(--bg-3);
}

/* ============================================
   SECTION: Left Navigation
   ============================================ */
#nav-panel {
  grid-column: 1;
  grid-row: 3;
  background: var(--bg-1);
  border-right: 1px solid var(--bg-3);
  overflow-y: auto;
  overflow-x: hidden;
  padding: var(--space-3) 0;
  position: relative;
}
.nav-title {
  font-family: var(--font-heading);
  font-size: var(--font-size-md);
  font-weight: 600;
  color: var(--gold);
  padding: var(--space-2) var(--space-4);
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.nav-section { margin-bottom: 2px; }
.nav-section-header {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-4);
  font-size: var(--font-size-md);
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all var(--transition-fast);
  border-left: 3px solid transparent;
}
.nav-section-header:hover { color: var(--text-primary); background: var(--bg-2); }
.nav-section-header.active {
  color: var(--gold-bright);
  border-left-color: var(--gold);
  background: rgba(201, 168, 76, 0.06);
}
.nav-section-header .nav-icon { font-size: var(--font-size-lg); width: var(--space-5); text-align: center; }
.nav-section-header .nav-chevron {
  margin-left: auto;
  font-size: var(--font-size-xs);
  transition: transform var(--transition-fast);
  color: var(--text-muted);
}
.nav-section-header.expanded .nav-chevron { transform: rotate(90deg); }
.nav-children {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows var(--transition-base);
}
.nav-children.expanded { grid-template-rows: 1fr; }
.nav-children-inner { overflow: hidden; }
.nav-child {
  padding: var(--space-1) var(--space-4) var(--space-1) var(--nav-child-indent);
  font-size: var(--font-size-base);
  color: var(--text-muted);
  cursor: pointer;
  transition: all var(--transition-fast);
}
.nav-child:hover { color: var(--text-primary); background: var(--bg-2); }
.nav-child.active { color: var(--gold-bright); }
.nav-divider { height: 1px; background: var(--bg-3); margin: var(--space-2) var(--space-4); }

#nav-resize {
  position: absolute;
  right: -3px;
  top: 0;
  bottom: 0;
  width: 6px;
  cursor: col-resize;
  z-index: 50;
}
#nav-resize:hover, #nav-resize.dragging { background: var(--gold-dim); opacity: 0.5; }

/* ============================================
   SECTION: Main Content Area
   ============================================ */
#main-content {
  grid-column: 2;
  grid-row: 3;
  overflow-y: auto;
  overflow-x: hidden;
  padding: clamp(0.75rem, 2vw, 1.5rem) clamp(1rem, 3vw, 2rem) 4rem;
  scroll-behavior: smooth;
}

/* Content width constraint — target prose blocks explicitly */
#main-content > .act-title,
#main-content > .act-duration,
#main-content > .section-title,
#main-content > .subsection-title,
#main-content > .block-read-aloud,
#main-content > .block-dm-note,
#main-content > .block-dm-tip,
#main-content > .block-skill-check,
#main-content > .block-encounter,
#main-content > .block-narrative,
#main-content > .block-vtt-cue,
#main-content > .stat-block,
#main-content > p {
  max-width: min(65ch, 100%);
  margin-inline: auto;
}

/* Conditional blocks keep their left indent */
#main-content > .block-conditional {
  max-width: min(65ch, 100%);
}

/* Tables/stat blocks get wider allowance */
#main-content > .block-table {
  max-width: min(80ch, 100%);
  margin-inline: auto;
}

/* ============================================
   SECTION: Combat Panel
   ============================================ */
#combat-panel {
  grid-column: 3;
  grid-row: 2 / 4;
  background: var(--bg-1);
  border-left: 1px solid var(--bg-3);
  overflow-y: auto;
  overflow-x: hidden;
  display: none;
}
#app.combat-open #combat-panel { display: block; }

.combat-header {
  position: sticky;
  top: 0;
  background: var(--bg-1);
  padding: var(--space-3) var(--space-4);
  border-bottom: 1px solid var(--bg-3);
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 10;
}
.combat-header h2 {
  font-family: var(--font-heading);
  font-size: var(--font-size-lg);
  color: var(--gold);
  letter-spacing: 0.5px;
}
.combat-close {
  width: var(--space-6); height: var(--space-6);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted); cursor: pointer; border-radius: var(--radius-md); font-size: var(--font-size-2xl);
}
.combat-close:hover { background: var(--bg-3); color: var(--text-primary); }
.combat-section { padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--bg-3); }
.combat-section-title {
  font-family: var(--font-heading);
  font-size: var(--font-size-sm);
  color: var(--gold-dim);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: var(--space-3);
}

/* ============================================
   SECTION: Block Type Styles
   ============================================ */

/* Read-Aloud */
.block-read-aloud {
  background: var(--parchment-bg);
  border-left: 4px solid var(--gold);
  border-radius: 4px;
  padding: 20px 24px;
  margin: 16px 0;
  font-family: var(--font-read-aloud);
  font-size: 15px;
  line-height: 1.8;
  color: var(--parchment-text);
  font-style: italic;
  position: relative;
}
.block-read-aloud p { margin-bottom: 12px; }
.block-read-aloud p:last-child { margin-bottom: 0; }
.block-read-aloud .present-btn {
  position: absolute;
  top: 8px; right: 8px;
  padding: 4px 10px;
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  color: var(--gold);
  background: var(--bg-2);
  border: 1px solid var(--gold-dim);
  border-radius: 3px;
  cursor: pointer;
  opacity: 0;
  transition: opacity var(--transition-fast), background var(--transition-fast);
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.block-read-aloud:hover .present-btn { opacity: 1; }
.block-read-aloud .present-btn:hover { background: var(--gold-dim); color: var(--bg-0); }

/* VTT Badge — shows on read-aloud blocks that auto-sync */
.vtt-badge {
  position: absolute; top: 6px; right: 40px;
  font-size: 10px; color: var(--gold); opacity: 0.6;
  pointer-events: none;
}

/* VTT Cue — clickable inline buttons for map/scene transitions */
.block-vtt-cue {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; margin: 6px 0;
  background: rgba(201, 168, 76, 0.08);
  border: 1px solid rgba(201, 168, 76, 0.25);
  border-radius: 6px; cursor: pointer;
  transition: background var(--transition-fast);
}
.block-vtt-cue:hover { background: rgba(201, 168, 76, 0.15); }
.block-vtt-cue__icon { font-size: 14px; }
.block-vtt-cue__label {
  font-family: var(--font-mono); font-size: 12px;
  color: var(--gold); font-weight: 500;
}

/* DM Note */
.block-dm-note {
  background: var(--bg-2);
  border-left: 3px solid var(--gold-dim);
  border-radius: 4px;
  margin: 12px 0;
  overflow: hidden;
}
.block-dm-note .block-header {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px;
  cursor: pointer;
  font-size: 13px; font-weight: 600;
  color: var(--text-secondary);
  transition: color var(--transition-fast);
}
.block-dm-note .block-header:hover { color: var(--text-primary); }
.block-dm-note .block-header .icon { font-size: 14px; }
.block-dm-note .block-header .chevron {
  margin-left: auto; font-size: 10px;
  transition: transform var(--transition-base);
  color: var(--text-muted);
}
.block-dm-note .block-header.expanded .chevron { transform: rotate(90deg); }
.block-dm-note .block-body {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows var(--transition-base);
}
.block-dm-note .block-body.expanded { grid-template-rows: 1fr; }
.block-dm-note .block-body-inner { overflow: hidden; padding: 0 14px; }
.block-dm-note .block-body.expanded .block-body-inner { padding-bottom: 14px; }
.block-dm-note .block-body-inner p { font-size: 13px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 8px; }

/* DM Tip */
.block-dm-tip {
  background: rgba(46, 134, 171, 0.08);
  border-left: 3px solid var(--blue);
  border-radius: 4px;
  margin: 12px 0;
  overflow: hidden;
}
.block-dm-tip .block-header {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 14px;
  cursor: pointer;
  font-size: 12px; font-weight: 500;
  color: var(--blue-bright);
}
.block-dm-tip .block-header .chevron {
  margin-left: auto; font-size: 10px;
  transition: transform var(--transition-base);
}
.block-dm-tip .block-header.expanded .chevron { transform: rotate(90deg); }
.block-dm-tip .block-body {
  display: grid; grid-template-rows: 0fr;
  transition: grid-template-rows var(--transition-base);
}
.block-dm-tip .block-body.expanded { grid-template-rows: 1fr; }
.block-dm-tip .block-body-inner { overflow: hidden; padding: 0 14px; }
.block-dm-tip .block-body.expanded .block-body-inner { padding-bottom: 12px; }
.block-dm-tip .block-body-inner p { font-size: 12px; color: var(--text-secondary); line-height: 1.7; }

/* Skill Check */
.block-skill-check {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px;
  background: var(--bg-2);
  border-radius: 6px;
  margin: 10px 0;
  border: 1px solid var(--bg-4);
}
.dc-badge {
  display: flex; align-items: center; justify-content: center;
  min-width: 42px; height: 42px;
  background: var(--bg-3);
  border: 2px solid var(--gold-dim);
  border-radius: 6px;
  font-family: var(--font-mono);
  font-size: 16px; font-weight: 600;
  color: var(--gold-bright);
  flex-shrink: 0;
  text-align: center;
  line-height: 1.2;
}
.skill-check-info { flex: 1; }
.skill-check-info .check-name { font-weight: 600; font-size: 13px; color: var(--text-primary); }
.skill-check-info .check-details { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

/* Encounter */
.block-encounter {
  background: rgba(192, 57, 43, 0.06);
  border: 1px solid var(--red-dark);
  border-left: 4px solid var(--red);
  border-radius: 4px;
  padding: 14px 16px;
  margin: 14px 0;
}
.block-encounter .encounter-title {
  font-family: var(--font-heading);
  font-size: 13px; font-weight: 600;
  color: var(--red-bright);
  margin-bottom: 8px;
  letter-spacing: 0.3px;
}
.block-encounter p { font-size: 13px; color: var(--text-secondary); }

/* Narrative */
.block-narrative { margin: 10px 0; font-size: 14px; color: var(--text-primary); line-height: 1.7; }
.block-narrative p { margin-bottom: 10px; }
.block-narrative strong { color: var(--gold-bright); font-weight: 600; }

/* Conditional */
.block-conditional {
  margin: 10px 0 10px 16px;
  border-left: 2px solid var(--bg-4);
  overflow: hidden;
}
.block-conditional .block-header {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 12px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-secondary);
  font-style: italic;
}
.block-conditional .block-header .chevron {
  margin-left: auto; font-size: 10px;
  transition: transform var(--transition-base);
}
.block-conditional .block-header.expanded .chevron { transform: rotate(90deg); }
.block-conditional .block-body {
  display: grid; grid-template-rows: 0fr;
  transition: grid-template-rows var(--transition-base);
}
.block-conditional .block-body.expanded { grid-template-rows: 1fr; }
.block-conditional .block-body-inner { overflow: hidden; padding: 0 12px; }
.block-conditional .block-body.expanded .block-body-inner { padding-bottom: 10px; }

/* Table */
.block-table { margin: 14px 0; overflow-x: auto; border-radius: 6px; border: 1px solid var(--bg-4); }
.block-table table { width: 100%; border-collapse: collapse; font-size: 13px; }
.block-table th {
  background: var(--bg-3);
  padding: 8px 12px;
  text-align: left;
  font-weight: 600;
  color: var(--gold);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  border-bottom: 2px solid var(--gold-dim);
}
.block-table td { padding: 8px 12px; border-bottom: 1px solid var(--bg-3); color: var(--text-secondary); }
.block-table tr:last-child td { border-bottom: none; }
.block-table tr:hover td { background: var(--bg-2); }

/* ============================================
   SECTION: Content Typography
   ============================================ */
.act-title {
  font-family: var(--font-heading);
  font-size: 24px; font-weight: 700;
  color: var(--gold-bright);
  margin-bottom: 4px;
  letter-spacing: 1px;
}
.act-duration {
  font-family: var(--font-mono);
  font-size: 12px; color: var(--text-muted);
  margin-bottom: 24px;
}
.section-title {
  font-family: var(--font-heading);
  font-size: 17px; font-weight: 600;
  color: var(--text-heading);
  margin: 28px 0 12px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--bg-3);
}
.subsection-title {
  font-family: var(--font-heading);
  font-size: 14px; font-weight: 600;
  color: var(--gold);
  margin: 20px 0 8px;
}

/* ============================================
   SECTION: Entity Tooltips
   ============================================ */
.entity-npc { color: var(--blue-bright); border-bottom: 1px dotted var(--blue); cursor: help; }
.entity-dc { font-family: var(--font-mono); font-weight: 600; color: var(--gold-bright); cursor: help; }
.entity-spell { color: var(--purple-light); border-bottom: 1px dotted var(--purple); cursor: help; }

#tooltip {
  position: fixed; z-index: 9999;
  max-width: 320px; padding: 12px 14px;
  background: var(--bg-3);
  border: 1px solid var(--bg-4);
  border-radius: 6px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  font-size: 12px; line-height: 1.5;
  color: var(--text-primary);
  pointer-events: none;
  display: none; opacity: 0;
  transition: opacity var(--transition-fast);
}
#tooltip.visible { display: block; opacity: 1; }
#tooltip .tooltip-title { font-weight: 600; color: var(--gold-bright); margin-bottom: 4px; }
#tooltip .tooltip-subtitle { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
#tooltip .tooltip-body { color: var(--text-secondary); }

/* ============================================
   SECTION: Search Overlay
   ============================================ */
#search-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  z-index: 10000;
  display: none;
  align-items: flex-start; justify-content: center;
  padding-top: 15vh;
}
#search-overlay.open { display: flex; }
#search-box {
  width: 560px; max-height: 480px;
  background: var(--bg-2);
  border: 1px solid var(--bg-4);
  border-radius: 10px;
  box-shadow: 0 16px 48px rgba(0,0,0,0.6);
  overflow: hidden;
  display: flex; flex-direction: column;
}
#search-input-wrap {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--bg-3);
}
#search-input-wrap .search-icon { color: var(--text-muted); font-size: 16px; }
#search-input {
  flex: 1; background: none; border: none; outline: none;
  font-family: var(--font-body);
  font-size: 15px; color: var(--text-primary);
}
#search-input::placeholder { color: var(--text-muted); }
#search-results { overflow-y: auto; flex: 1; padding: 8px; }
.search-group-label {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 600;
  color: var(--text-muted);
  letter-spacing: 1px; text-transform: uppercase;
  padding: 8px 8px 4px;
}
.search-result {
  padding: 8px 10px; border-radius: 6px;
  cursor: pointer;
  transition: background var(--transition-fast);
}
.search-result:hover, .search-result.selected { background: var(--bg-3); }
.search-result-title { font-size: 13px; font-weight: 500; color: var(--text-primary); }
.search-result-preview {
  font-size: 12px; color: var(--text-muted); margin-top: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.search-result mark { background: var(--gold-dim); color: var(--gold-light); border-radius: 2px; padding: 0 2px; }
.search-empty { padding: 24px; text-align: center; color: var(--text-muted); font-size: 13px; }
.search-category {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 600;
  color: var(--text-muted);
  letter-spacing: 1px; text-transform: uppercase;
  padding: 12px 8px 4px;
}
.search-result-item {
  padding: 8px 10px; border-radius: 6px;
  cursor: pointer; display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px;
  transition: background var(--transition-fast);
}
.search-result-item:hover, .search-result-item.selected { background: var(--bg-3); }
.search-result-item .search-result-title { font-size: 13px; font-weight: 500; color: var(--text-primary); }
.search-result-item .search-result-label {
  font-size: 11px; color: var(--text-muted); font-family: var(--font-mono);
}
.search-result-item .search-result-preview {
  width: 100%; font-size: 12px; color: var(--text-muted); margin-top: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* ============================================
   SECTION: Presentation Mode
   ============================================ */
#presentation-overlay {
  position: fixed; inset: 0;
  background: rgba(10, 12, 18, 0.94);
  z-index: 10001;
  display: none;
  flex-direction: column;
  align-items: center; justify-content: center;
  padding: 48px 48px 96px;
}
#presentation-overlay.open { display: flex; }
#presentation-frame {
  max-width: 720px; width: 100%;
  max-height: calc(100vh - 200px);
  overflow-y: auto;
  padding: 48px 56px;
  position: relative;
  border: 2px solid var(--gold-dim);
  scrollbar-width: thin;
  scrollbar-color: var(--gold-dim) transparent;
}
#presentation-frame::-webkit-scrollbar { width: 4px; }
#presentation-frame::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 2px; }
#presentation-frame::-webkit-scrollbar-track { background: transparent; }
#presentation-frame::before {
  content: '';
  position: absolute; inset: -12px;
  border: 1px solid var(--gold-dim);
  border-radius: 2px;
  pointer-events: none;
}
#presentation-frame::after {
  content: '\u25C6';
  position: absolute;
  top: -20px; left: 50%;
  transform: translateX(-50%);
  color: var(--gold);
  font-size: 16px; font-style: normal;
}
#presentation-content {
  font-family: var(--font-read-aloud);
  font-size: 26px; line-height: 1.8;
  color: var(--parchment-text);
  font-style: italic;
  text-align: center;
}
#presentation-content p {
  margin-bottom: 20px;
  opacity: 0;
  animation: presentFadeIn 0.6s ease forwards;
}
#presentation-content p:last-child { margin-bottom: 0; }

/* Stagger animations for visible paragraphs */
#presentation-content p:nth-child(1) { animation-delay: 0.15s; }
#presentation-content p:nth-child(2) { animation-delay: 0.35s; }
#presentation-content p:nth-child(3) { animation-delay: 0.55s; }
#presentation-content p:nth-child(4) { animation-delay: 0.75s; }
#presentation-content p:nth-child(5) { animation-delay: 0.95s; }
#presentation-content p:nth-child(n+6) { animation-delay: 1.1s; }

/* Non-read-aloud interstitials in presentation */
.present-interstitial {
  font-family: var(--font-body);
  font-style: normal;
  font-size: 14px;
  text-align: left;
  color: var(--text-secondary);
  background: var(--bg-2);
  border: 1px solid var(--bg-4);
  border-radius: 6px;
  padding: 14px 18px;
  margin: 24px 0;
  animation: presentFadeIn 0.4s ease forwards;
  opacity: 0;
}
.present-interstitial .interstitial-type {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 6px;
}
.present-interstitial .interstitial-type.type-dm-note { color: var(--gold); }
.present-interstitial .interstitial-type.type-skill-check { color: var(--gold-bright); }
.present-interstitial .interstitial-type.type-encounter { color: var(--red-bright); }
.present-interstitial .interstitial-dc {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 16px; font-weight: 600;
  color: var(--gold-bright);
  background: var(--bg-3);
  border: 2px solid var(--gold-dim);
  border-radius: 4px;
  padding: 2px 8px;
  margin-right: 8px;
}

@keyframes presentFadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

#presentation-nav {
  display: flex; align-items: center; gap: 12px;
  margin-top: 20px;
}
#presentation-nav button {
  padding: 8px 20px;
  font-family: var(--font-body);
  font-size: 13px; font-weight: 500;
  border: 1px solid var(--gold-dim);
  border-radius: 4px;
  background: var(--bg-3);
  color: var(--gold);
  cursor: pointer;
  transition: all var(--transition-fast);
}
#presentation-nav button:hover { background: var(--gold-dim); color: var(--bg-0); }
#presentation-nav button:disabled { opacity: 0.3; cursor: default; }
#presentation-nav button:disabled:hover { background: var(--bg-3); color: var(--gold); }
#presentation-counter {
  font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);
}
#presentation-hints {
  position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
  font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);
}
#presentation-hints kbd {
  display: inline-block; padding: 2px 6px;
  background: var(--bg-3); border: 1px solid var(--bg-4);
  border-radius: 3px; font-family: var(--font-mono);
  font-size: 10px; color: var(--text-secondary);
}

/* ============================================
   SECTION: Brazier Animations
   ============================================ */
.braziers-row { display: flex; gap: 12px; justify-content: center; margin: 8px 0 16px; }
.brazier {
  width: 48px; height: 56px;
  display: flex; flex-direction: column; align-items: center;
  cursor: pointer; position: relative;
}
.brazier-bowl {
  width: 32px; height: 20px;
  background: var(--bg-4);
  border-radius: 0 0 12px 12px;
  border: 2px solid var(--text-muted);
  border-top: none;
  position: relative;
  margin-top: auto;
}
.brazier-flame {
  position: absolute; bottom: 16px; left: 50%;
  transform: translateX(-50%);
  width: 16px; height: 24px;
  background: var(--brazier-blue);
  border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  filter: blur(1px); opacity: 0.9;
  animation: flameDance 1.2s ease-in-out infinite alternate;
  box-shadow: 0 0 12px var(--brazier-blue), 0 0 24px rgba(74, 158, 255, 0.3);
}
.brazier:nth-child(2) .brazier-flame { animation-delay: 0.2s; }
.brazier:nth-child(3) .brazier-flame { animation-delay: 0.4s; }
.brazier:nth-child(4) .brazier-flame { animation-delay: 0.6s; }
.brazier:nth-child(5) .brazier-flame { animation-delay: 0.8s; }

.brazier.extinguished .brazier-flame {
  background: var(--text-muted);
  height: 8px; width: 8px;
  opacity: 0.3; filter: blur(3px);
  box-shadow: none;
  animation: smokeWisp 2s ease-in-out infinite;
}
.brazier.extinguished .brazier-bowl { border-color: var(--text-muted); opacity: 0.5; }

@keyframes flameDance {
  0% { height: 22px; width: 14px; opacity: 0.85; }
  25% { height: 26px; width: 16px; opacity: 1; }
  50% { height: 20px; width: 15px; opacity: 0.9; }
  75% { height: 28px; width: 13px; opacity: 0.95; }
  100% { height: 24px; width: 16px; opacity: 0.88; }
}
@keyframes smokeWisp {
  0%, 100% { opacity: 0.3; transform: translateX(-50%) translateY(0); }
  50% { opacity: 0.1; transform: translateX(-50%) translateY(-6px); }
}

.immunity-meter { display: flex; gap: 2px; height: 8px; margin: 8px 0; }
.immunity-segment { flex: 1; border-radius: 2px; transition: all var(--transition-base); }
.immunity-segment.active { background: var(--brazier-blue); }
.immunity-segment.inactive { background: var(--bg-4); }

/* HP Bars */
.hp-bar-wrap {
  height: 16px; background: var(--bg-3);
  border-radius: 4px; overflow: hidden;
  position: relative; margin: 4px 0;
}
.hp-bar-fill {
  height: 100%; border-radius: 4px;
  transition: width var(--transition-base), background var(--transition-base);
}
.hp-bar-fill.healthy { background: var(--heat-green); }
.hp-bar-fill.wounded { background: var(--heat-amber); }
.hp-bar-fill.critical { background: var(--red); animation: criticalPulse 1s ease-in-out infinite; }
.hp-bar-label {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  color: var(--text-primary); text-shadow: 0 1px 2px rgba(0,0,0,0.8);
}
.hp-phase-marker {
  position: absolute; top: 0; bottom: 0;
  width: 2px; background: var(--gold); opacity: 0.6;
}
@keyframes criticalPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

/* Initiative tracker */
.init-list { list-style: none; }
.init-item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; border-radius: 4px; font-size: 12px;
  transition: background var(--transition-fast);
}
.init-item.active-turn { background: rgba(201, 168, 76, 0.12); border-left: 3px solid var(--gold); }
.init-value { font-family: var(--font-mono); font-weight: 600; width: 24px; text-align: center; color: var(--text-muted); }
.init-input {
  font-family: var(--font-mono); font-weight: 600; width: 36px; text-align: center;
  background: var(--bg-3); border: 1px solid var(--bg-4); border-radius: 3px;
  color: var(--gold); padding: 2px 0; font-size: 12px;
}
.init-input:focus { outline: 1px solid var(--gold); border-color: var(--gold); }
.init-input::placeholder { color: var(--text-muted); opacity: 0.5; }
.init-name { flex: 1; font-weight: 500; }
.condition-badge { font-size: 10px; padding: 1px 6px; border-radius: 3px; font-weight: 500; }
.condition-badge.dominated { background: var(--red-dark); color: var(--red-light); }

/* Dominate toggle */
.dominate-toggle {
  display: flex; align-items: center; gap: 10px;
  padding: 10px; background: var(--bg-3); border-radius: 6px; margin: 8px 0;
}
.dominate-toggle.active { background: rgba(192, 57, 43, 0.15); border: 1px solid var(--red-dark); }
.dominate-switch {
  width: 36px; height: 20px;
  background: var(--bg-4); border-radius: 10px;
  cursor: pointer; position: relative;
  transition: background var(--transition-fast);
}
.dominate-switch.active { background: var(--red); }
.dominate-switch::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 16px; height: 16px;
  background: var(--text-primary); border-radius: 50%;
  transition: transform var(--transition-fast);
}
.dominate-switch.active::after { transform: translateX(16px); }

/* ============================================
   SECTION: Stat Block
   ============================================ */
.stat-block {
  background: var(--bg-2); border: 1px solid var(--bg-4);
  border-top: 3px solid var(--red); border-radius: 4px;
  padding: 16px; margin: 12px 0;
}
.stat-block-name { font-family: var(--font-heading); font-size: 18px; color: var(--red-bright); margin-bottom: 2px; }
.stat-block-type { font-size: 12px; font-style: italic; color: var(--text-muted); margin-bottom: 12px; }
.stat-block-divider { border: none; border-top: 1px solid var(--red-dark); margin: 10px 0; }
.stat-block-row { font-size: 13px; color: var(--text-secondary); margin: 3px 0; }
.stat-block-row strong { color: var(--text-primary); }
.stat-block-abilities {
  display: grid; grid-template-columns: repeat(6, 1fr);
  gap: 4px; text-align: center; margin: 10px 0;
}
.stat-block-abilities .ability-label { font-family: var(--font-mono); font-size: 10px; font-weight: 600; color: var(--gold); letter-spacing: 0.5px; }
.stat-block-abilities .ability-value { font-family: var(--font-mono); font-size: 13px; color: var(--text-primary); }
.stat-block-abilities .ability-mod { font-size: 11px; color: var(--text-muted); }
.stat-block-action { margin: 8px 0; }
.stat-block-action .action-name { font-weight: 600; font-style: italic; color: var(--text-primary); }

/* ============================================
   SECTION: Welcome Tab
   ============================================ */
.welcome-content { max-width: 640px; margin: 0 auto; }
.welcome-title {
  font-family: var(--font-heading);
  font-size: 32px; color: var(--gold-bright);
  text-align: center; margin-bottom: 4px;
}
.welcome-subtitle {
  font-family: var(--font-read-aloud);
  font-size: 16px; color: var(--text-muted);
  text-align: center; font-style: italic; margin-bottom: 32px;
}
.welcome-section-title {
  font-family: var(--font-heading);
  font-size: 14px; color: var(--gold);
  margin: 24px 0 8px; letter-spacing: 0.5px;
}
.shortcut-grid {
  display: grid; grid-template-columns: auto 1fr;
  gap: 6px 16px; font-size: 13px;
}
.shortcut-grid kbd {
  display: inline-block; padding: 2px 8px;
  background: var(--bg-3); border: 1px solid var(--bg-4);
  border-radius: 3px; font-family: var(--font-mono);
  font-size: 11px; color: var(--text-secondary);
  text-align: center; min-width: 48px;
}

/* Utility classes */
.flex { display: flex; }
.gap-4 { gap: 4px; }
.gap-8 { gap: 8px; }
.mt-4 { margin-top: 4px; }
.mt-8 { margin-top: 8px; }
.mt-16 { margin-top: 16px; }
.mb-8 { margin-bottom: 8px; }
.text-muted { color: var(--text-muted); }
.text-xs { font-size: 11px; }
.text-sm { font-size: 12px; }
.font-mono { font-family: var(--font-mono); }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; font-family: var(--font-body);
  font-size: 12px; font-weight: 500;
  border: 1px solid var(--bg-4); border-radius: 4px;
  background: var(--bg-3); color: var(--text-secondary);
  cursor: pointer; transition: all var(--transition-fast);
}
.btn:hover { background: var(--bg-4); color: var(--text-primary); }
.btn-gold { border-color: var(--gold-dim); color: var(--gold); }
.btn-gold:hover { background: var(--gold-dim); color: var(--bg-0); }
.btn-danger { border-color: var(--red-dark); color: var(--red-bright); }
.btn-danger:hover { background: var(--red-dark); }
.btn-sm { padding: 3px 8px; font-size: 11px; }

/* Inputs */
.input {
  padding: 6px 10px; font-family: var(--font-body); font-size: 12px;
  background: var(--bg-3); border: 1px solid var(--bg-4);
  border-radius: 4px; color: var(--text-primary); outline: none;
}
.input:focus { border-color: var(--gold-dim); }
.input-sm { padding: 3px 8px; font-size: 11px; width: 60px; }

/* Checklists */
.checklist-item {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 4px 0; font-size: 13px; color: var(--text-secondary);
}
.checklist-item input[type="checkbox"] { accent-color: var(--gold); margin-top: 3px; }
.checklist-item.checked { color: var(--text-muted); text-decoration: line-through; }

/* Noise & Vignette */
#noise-overlay {
  position: fixed; inset: 0; pointer-events: none; z-index: 99999;
  opacity: 0.03;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-repeat: repeat; background-size: 256px 256px;
}
#vignette-overlay {
  position: fixed; inset: 0; pointer-events: none; z-index: 99998;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.4) 100%);
}
</style>
</head>
<body>

<div id="app">
  <div id="tab-bar"></div>
  <div id="nav-heat-spacer"></div>
  <div id="heat-bar">
    <span class="heat-label">Heat</span>
    <div class="heat-gauge">
      <div class="heat-segment active" data-level="0"></div>
      <div class="heat-segment" data-level="1"></div>
      <div class="heat-segment" data-level="2"></div>
    </div>
    <span class="heat-status" id="heat-status">Unnoticed</span>
    <button class="btn btn-sm" id="vtt-controller-btn" style="margin-left:auto;font-size:12px;padding:4px 12px;cursor:pointer" onclick="window.open('controller/index.html','vtt-controller','width=520,height=900')">VTT Controller &#8599;</button>
  </div>
  <div id="nav-panel">
    <div id="nav-resize"></div>
    <div id="nav-tree"></div>
  </div>
  <div id="main-content"></div>
  <div id="combat-panel"></div>
</div>

<div id="tooltip"></div>

<div id="search-overlay">
  <div id="search-box">
    <div id="search-input-wrap">
      <span class="search-icon">&#8984;K</span>
      <input type="text" id="search-input" placeholder="Search acts, NPCs, spells, DCs..." autofocus>
    </div>
    <div id="search-results"></div>
  </div>
</div>

<div id="presentation-overlay">
  <div id="presentation-frame">
    <div id="presentation-content"></div>
  </div>
  <div id="presentation-nav">
    <button id="present-prev" disabled>&larr; Back</button>
    <span id="presentation-counter">1 / 1</span>
    <button id="present-next">Next &rarr;</button>
  </div>
  <div id="presentation-hints"><kbd>Esc</kbd> close &nbsp; <kbd>&larr;</kbd><kbd>&rarr;</kbd> navigate &nbsp; <kbd>Space</kbd> next</div>
</div>

<div id="noise-overlay"></div>
<div id="vignette-overlay"></div>


<script type="module" src="dm-guide/js/main.js"></script>
</body>
</html>
