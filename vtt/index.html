<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>The Puzzle-Box Job — VTT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400;1,600&family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css?v=4">
<link rel="stylesheet" href="css/layout.css?v=5">
<link rel="stylesheet" href="css/theater.css?v=4">
<link rel="stylesheet" href="css/map.css?v=4">
<link rel="stylesheet" href="css/initiative.css?v=4">
<link rel="stylesheet" href="css/effects.css?v=4">
<link rel="stylesheet" href="css/controls.css?v=4">
<link rel="stylesheet" href="css/player-nav.css?v=4">
<link rel="stylesheet" href="css/scene-navigator.css?v=4">
<link rel="stylesheet" href="css/tokens.css?v=1">
</head>
<body>
  <!-- Loading screen -->
  <div id="loading" class="loading">
    <div class="loading__title">The Puzzle-Box Job</div>
    <div class="loading__bar"><div class="loading__fill"></div></div>
    <div class="loading__status">Loading assets…</div>
  </div>

  <!-- Theater Mode: full-screen scene art + text overlays -->
  <div id="theater" class="layer">
    <img id="theater-bg" class="theater-bg" alt="">
    <img id="theater-bg-next" class="theater-bg theater-bg--next" alt="">
    <div id="theater-overlay" class="theater-overlay"></div>
    <div id="title-card" class="title-card">
      <div class="title-card__act"></div>
      <div class="title-card__subtitle"></div>
    </div>
  </div>

  <!-- Map Mode: multi-layer canvas stack -->
  <div id="map-container" class="layer" hidden>
    <canvas id="map-bg" class="map-canvas"></canvas>
    <canvas id="map-fog" class="map-canvas"></canvas>
    <canvas id="map-grid" class="map-canvas"></canvas>
    <canvas id="map-tokens" class="map-canvas"></canvas>
    <canvas id="map-effects" class="map-canvas"></canvas>
    <div id="map-labels" class="map-labels"></div>
  </div>

  <!-- Initiative Tracker Overlay (shows over map) -->
  <div id="initiative-panel" class="initiative-panel" hidden></div>

  <!-- Heat Indicator -->
  <div id="heat-indicator" class="heat-indicator" hidden>
    <span class="heat-indicator__dot"></span>
    <span class="heat-indicator__label"></span>
  </div>

  <!-- Token context menu (right-click) -->
  <div id="token-menu" class="token-menu" hidden></div>

  <!-- Token Tray (DM tool, T key to toggle) -->
  <div id="token-tray" class="token-tray" hidden>
    <div class="token-tray__header">
      <span class="token-tray__title">Tokens</span>
      <button class="token-tray__close" aria-label="Close token tray">&times;</button>
    </div>
    <div class="token-tray__sections"></div>
  </div>

  <!-- Screen flash overlay for effects -->
  <div id="screen-flash" class="screen-flash"></div>

  <!-- Scene Navigator Panel (opens from bottom nav) -->
  <div id="scene-navigator" class="scene-nav"></div>

  <!-- Player Navigation Bar -->
  <nav id="player-nav" class="player-nav" aria-label="Navigation"></nav>

  <!-- DM Controls Hint (only visible to DM, not players on Discord) -->
  <div id="dm-controls" class="dm-controls" hidden>
    <div class="dm-controls__inner"></div>
  </div>

  <script type="module" src="js/main.js?v=10"></script>
</body>
</html>
